services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rh-artf-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rh-artf

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rh-artf-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - rh-artf

  nginx:
    image: nginx:1.27-alpine
    container_name: rh-artf-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rh-artf

  db:
    image: mysql:8.4
    container_name: rh-artf-db
    restart: unless-stopped
    ports:
      - "${DB_PUBLISH_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bd_api_rh_artf}
      MYSQL_USER: ${DB_USERNAME:-rh_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rh_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - rh_artf_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - rh-artf

volumes:
  rh_artf_mysql:

networks:
  rh-artf:
    driver: bridge
