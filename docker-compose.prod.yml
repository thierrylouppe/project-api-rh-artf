# Production : le code vient de l'image (COPY . .), pas d'un bind-mount du dépôt.
# Lancer uniquement avec :
#   docker compose --env-file .env.docker -f docker-compose.prod.yml config
#   docker compose --env-file .env.docker -f docker-compose.prod.yml up -d
#
# Ports hôtes recommandés si 8080 / 3307 / 3310 sont déjà pris :
#   APP_PORT=8081
#   DB_PUBLISH_PORT=3311

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rh-artf-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - rh_artf_storage:/var/www/html/storage
      - rh_artf_public:/shared/public
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      SYNC_PUBLIC_TO: /shared/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rh-artf

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rh-artf-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - rh_artf_storage:/var/www/html/storage
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - rh-artf

  nginx:
    image: nginx:1.27-alpine
    container_name: rh-artf-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - rh_artf_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rh-artf

  db:
    image: mysql:8.4
    container_name: rh-artf-db
    restart: unless-stopped
    ports:
      - "${DB_PUBLISH_PORT:-3311}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bd_api_rh_artf}
      MYSQL_USER: ${DB_USERNAME:-rh_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rh_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - rh_artf_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - rh-artf

volumes:
  rh_artf_mysql:
  rh_artf_storage:
  rh_artf_public:

networks:
  rh-artf:
    driver: bridge
